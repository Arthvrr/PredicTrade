<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredicTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans antialiased selection:bg-blue-500/30">
    
    <main class="max-w-4xl mx-auto px-6 py-12">
        <!-- En-tête et Recherche -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-6">
                PredicTrade
            </h1>
            
            <form id="searchForm" class="max-w-md mx-auto relative">
                <div class="relative flex items-center">
                    <svg class="w-5 h-5 absolute left-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="tickerInput" placeholder="Rechercher un ticker (ex: AAPL)" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-12 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all uppercase">
                    <button type="submit" class="absolute right-2 px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors">
                        Rechercher
                    </button>
                </div>
                <p id="errorMsg" class="text-red-400 text-sm mt-3 hidden"></p>
            </form>
        </div>

        <!-- Dashboard des résultats (Masqué par défaut) -->
        <!-- Dashboard des résultats (Masqué par défaut) -->
        <div id="dashboard" class="hidden flex flex-col gap-6">
            
            <div class="flex flex-col md:flex-row md:items-end justify-between pb-4 border-b border-slate-800">
                <div>
                    <h2 id="stockName" class="text-2xl font-bold text-white">--</h2>
                    <p id="stockTicker" class="text-slate-400 text-sm font-mono mt-1">--</p>
                </div>
                <div class="mt-4 md:mt-0 text-right">
                    <p id="stockPrice" class="text-3xl font-bold text-white">--</p>
                    <p id="stockVar" class="text-sm font-medium mt-1">--</p>
                </div>
            </div>

            <!-- Filtres de temps -->
            <div class="flex flex-wrap gap-2" id="timeFilters">
                <button data-period="1D" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">1D</button>
                <button data-period="1W" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">1W</button>
                <button data-period="1M" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">1M</button>
                <button data-period="3M" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">3M</button>
                <button data-period="6M" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">6M</button>
                <button data-period="1Y" class="period-btn px-3 py-1 text-sm rounded-full bg-blue-600 text-white font-medium transition-colors active">1Y</button>
                <button data-period="YTD" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">YTD</button>
                <button data-period="5Y" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">5Y</button>
                <button data-period="ALL" class="period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">ALL</button>
            </div>

            <!-- Graphique -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl h-[400px] relative">
                <div id="chartLoading" class="hidden absolute inset-0 bg-slate-900/80 flex items-center justify-center rounded-xl z-10">
                    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <canvas id="priceChart"></canvas>
            </div>

            <!-- NOUVEAU : Écriteau de Prédiction ML -->
            <div id="mlCard" class="bg-gradient-to-r from-blue-900/40 to-slate-800 border border-blue-800/50 p-6 rounded-xl hidden">
                <div class="flex items-center gap-3 mb-2">
                    <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <h3 class="text-lg font-semibold text-blue-100">Prédiction Machine Learning (Régression Linéaire)</h3>
                </div>
                <p class="text-slate-400 text-sm mb-4">Le modèle estime la valeur du prochain point basé sur la corrélation statistique de la période sélectionnée.</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                        <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Estimation</p>
                        <p id="mlPred" class="text-2xl font-bold text-white">--</p>
                    </div>
                    <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 col-span-2 md:col-span-3">
                        <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Plage Probable (± 1 Écart-type)</p>
                        <div class="flex items-center gap-4 mt-1">
                            <span id="mlMin" class="text-xl font-bold text-slate-300">--</span>
                            <div class="flex-1 h-2 bg-slate-700 rounded-full relative">
                                <div class="absolute inset-y-0 left-1/4 right-1/4 bg-blue-500/50 rounded-full"></div>
                                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-blue-400 rounded-full shadow-[0_0_10px_rgba(96,165,250,0.8)]"></div>
                            </div>
                            <span id="mlMax" class="text-xl font-bold text-slate-300">--</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let chartInstance = null;
        let currentTicker = "";
        let currentPeriod = "1Y";

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            currentTicker = document.getElementById('tickerInput').value;
            fetchData(currentTicker, currentPeriod);
        });

        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!currentTicker) return;
                currentPeriod = e.target.getAttribute('data-period');
                updateActiveButton(currentPeriod);
                fetchData(currentTicker, currentPeriod);
            });
        });

        function updateActiveButton(activePeriod) {
            document.querySelectorAll('.period-btn').forEach(btn => {
                if (btn.getAttribute('data-period') === activePeriod) {
                    btn.className = "period-btn px-3 py-1 text-sm rounded-full bg-blue-600 text-white font-medium transition-colors active";
                } else {
                    btn.className = "period-btn px-3 py-1 text-sm rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors";
                }
            });
        }

        async function fetchData(ticker, period) {
            const errorMsg = document.getElementById('errorMsg');
            const dashboard = document.getElementById('dashboard');
            const chartLoading = document.getElementById('chartLoading');
            const mlCard = document.getElementById('mlCard');
            
            errorMsg.classList.add('hidden');
            dashboard.classList.remove('hidden');
            chartLoading.classList.remove('hidden');
            mlCard.classList.add('hidden'); // On cache la carte ML pendant le chargement

            try {
                const response = await fetch('/api/stock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker: ticker, period: period })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('stockName').textContent = data.name;
                    document.getElementById('stockTicker').textContent = data.ticker;
                    document.getElementById('stockPrice').textContent = `$${data.current_price.toFixed(2)}`;
                    
                    const varEl = document.getElementById('stockVar');
                    const sign = data.variation >= 0 ? '+' : '';
                    varEl.textContent = `${sign}${data.variation}% sur ${data.period}`;
                    varEl.className = data.variation >= 0 ? "text-sm font-medium mt-1 text-emerald-400" : "text-sm font-medium mt-1 text-red-400";

                    updateChart(data.dates, data.prices);

                    // Mise à jour de la carte ML
                    if (data.ml) {
                        document.getElementById('mlPred').textContent = `$${data.ml.prediction.toFixed(2)}`;
                        document.getElementById('mlMin').textContent = `$${data.ml.range_min.toFixed(2)}`;
                        document.getElementById('mlMax').textContent = `$${data.ml.range_max.toFixed(2)}`;
                        mlCard.classList.remove('hidden');
                    }

                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.classList.remove('hidden');
                    dashboard.classList.add('hidden');
                }
            } catch (error) {
                errorMsg.textContent = "Erreur de connexion au serveur.";
                errorMsg.classList.remove('hidden');
            } finally {
                chartLoading.classList.add('hidden');
            }
        }

        function updateChart(dates, prices) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Prix',
                        data: prices,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointHitRadius: 10,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#94a3b8',
                            bodyColor: '#f8fafc',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) { return `$${context.parsed.y}`; }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 8, color: '#64748b' }
                        },
                        y: {
                            grid: { color: '#1e293b' },
                            ticks: {
                                color: '#64748b',
                                callback: function(value) { return '$' + value; }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
